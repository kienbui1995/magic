# 1-click local dev stack: magic core + postgres + redis.
# Run: docker compose up -d
#
# For full observability (Prometheus/Grafana/Jaeger), see
# deploy/docker-compose.observability.yml instead.

name: magic-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: magic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-magic}
      POSTGRES_DB: magic
    ports:
      - "5432:5432"
    volumes:
      - magic-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magic -d magic"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  magic:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MAGIC_POSTGRES_URL: "postgres://magic:${POSTGRES_PASSWORD:-magic}@postgres:5432/magic?sslmode=disable"
      MAGIC_REDIS_URL: "redis://redis:6379"
      MAGIC_API_KEY: ${MAGIC_API_KEY:-dev-key-change-me}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  magic-dev-postgres:
